{%- assign me = site.data.profile -%}
<ul class="contact-links{% if include.compact %} contact-links--compact{% endif %}">
  {%- if me.email != "" %}
  <li><a href="mailto:{{ me.email }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 6h18v12H3z M3 7l9 6 9-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>{{ me.email }}</span></a></li>
  {%- endif %}
  {%- if me.telegram != "" %}
  <li><a href="https://t.me/{{ me.telegram }}" target="_blank" rel="noopener"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M21 4 3 11l6 2 2 6 3-4 5 4z M9 13l8-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>@{{ me.telegram }}</span></a></li>
  {%- endif %}
  {%- if me.linkedin != "" %}
  <li><a href="{{ me.linkedin }}" target="_blank" rel="noopener"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 4h16v16H4z M8 10v6 M8 7.5v.01 M12 16v-6 M12 12.5c0-1.5 1-2.5 2.3-2.5S16 11 16 12.5V16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>LinkedIn</span></a></li>
  {%- endif %}
  {%- if me.github != "" %}
  <li><a href="https://github.com/{{ me.github }}" target="_blank" rel="noopener"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 19c-4 1.3-4-2-6-2.5m12 4.5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12 12 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>GitHub</span></a></li>
  {%- endif %}
</ul>
