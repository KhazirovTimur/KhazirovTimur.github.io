{%- assign lang = include.lang | default: "en" -%}
{%- assign t = site.data.i18n.ui -%}
{%- assign me = site.data.profile -%}
<section class="contact-band" id="contact">
  <div class="container contact-band__inner">
    <div>
      <p class="eyebrow">{{ t.contact[lang] }}</p>
      <h2 class="contact-band__title">{{ t.contacts_title[lang] }}</h2>
      <p class="contact-band__text">{{ t.contacts_text[lang] }}</p>
    </div>
    <div class="contact-band__actions">
      {% include contact-links.html %}
      <a class="btn btn--primary" href="{{ me.cv[lang] | default: me.cv.en | relative_url }}" download>{{ t.download_cv[lang] }} <span aria-hidden="true">↓</span></a>
    </div>
  </div>
</section>
