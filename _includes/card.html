{%- assign p = include.p -%}
<article class="card">
  <a class="card__link" href="{{ p.url | relative_url }}">
    <div class="card__cover card__cover--{{ p.accent | default: 'orange' }}">
      <span class="card__cover-label" aria-hidden="true">{{ p.cover_label | default: p.engine }}</span>
      {%- if p.cover %}
      <img src="{{ p.cover }}" alt="" loading="lazy" onerror="this.remove()">
      {%- endif %}
    </div>
    <div class="card__body">
      <p class="card__eyebrow">{{ p.eyebrow }}</p>
      <h3 class="card__title">{{ p.title }}</h3>
      <p class="card__summary">{{ p.summary }}</p>
      {%- if p.tags %}
      <ul class="tags">
        {%- for tag in p.tags limit: 4 %}<li>{{ tag }}</li>{% endfor %}
      </ul>
      {%- endif %}
      <span class="card__more">{{ include.more }} <span aria-hidden="true">→</span></span>
    </div>
  </a>
</article>
