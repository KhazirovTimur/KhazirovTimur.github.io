      ru: "Механики оружия и боя, интеграция геймплейных систем, прототипирование и итерации, прототипирование техники и передвижения, прогрессия игрока, дизайн экономики, документация"
  - name: { en: "Unreal Engine", ru: "Unreal Engine" }
    text:
      en: "UE4/UE5, Blueprints, C++ gameplay programming, Gameplay Tags, Enhanced Input, Animation Blueprints, Behavior Trees, AI Controllers, State Machines, Data Tables, Primary Data Assets, NavMesh, Gameplay Debugging"
      ru: "UE4/UE5, Blueprints, геймплейное программирование на C++, Gameplay Tags, Enhanced Input, Animation Blueprints, Behavior Trees, AI Controllers, State Machines, Data Tables, Primary Data Assets, NavMesh, Gameplay Debugging"
