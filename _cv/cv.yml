# Bullets per career entry. `ref` matches the project ref in _data/career.yml
# (the QA entry has ref: qa). Order follows _data/career.yml.
jobs:
  pioner:
    project:
      en: "PIONER (Steam, released) — multiplayer open-world survival shooter, Unreal Engine 5"
      ru: "PIONER (Steam, вышел) — multiplayer survival-шутер с открытым миром, Unreal Engine 5"
    bullets:
      en:
        - "Owned four features end-to-end, from spec to in-engine implementation in Blueprints: hip-fire spread, dynamic crosshair, automatic reload and a full rework of the perk system — all integrated into existing systems without breaking them."
        - "Balance a set of interconnected systems: combat, economy, progression, loot, crafting, vendor pricing and boss parameters."
        - "Built a C++ tool that walks a level and exports every loot spawner (~3,000 on the largest map) with its loot tables and expected item counts to CSV, so loot can be balanced across the whole map in spreadsheets."
        - "Prototype and iterate on weapons, armor, consumables and enemies for live updates, based on internal testing and player feedback."
        - "Work hands-on inside existing Behavior Trees and C++ systems to understand how mechanics interact before changing them; fix gameplay issues via Blueprints."
        - "Write and maintain balance tables and feature specs; mentor junior designers and review their design documents."
        - "Work closely with engineers and artists to take new weapons and systems from concept to live content."
      ru:
        - "Вёл от ТЗ до реализации на Blueprints четыре фичи: разброс при стрельбе от бедра, динамический прицел, автоматическую перезарядку и полную переработку системы перков — и встроил их в существующие системы, ничего не сломав."
        - "Балансирую набор связанных систем: бой, экономику, прогрессию, лут, крафт, цены у торговцев и параметры боссов."
        - "Написал на C++ инструмент, который проходит по уровню и выгружает в CSV все спавнеры лута (около 3 000 на самой большой карте) с лут-таблицами и ожидаемым количеством предметов — лут всей карты можно балансировать в таблицах."
        - "Прототипирую и дорабатываю оружие, броню, расходники и врагов для live-обновлений по итогам внутренних тестов и отзывов игроков."
        - "Разбираюсь в существующих Behavior Trees и C++-системах, чтобы понять, как связаны механики, прежде чем их менять; геймплейные баги чиню через Blueprints."
        - "Пишу и поддерживаю балансные таблицы и ТЗ; менторю младших дизайнеров и ревьюю их диздоки."
        - "Вместе с программистами и художниками довожу новое оружие и системы от концепта до live-контента."
  the-braves:
    project:
      en: "The Braves (Steam, released) — live-service action game in the spirit of Vampire Survivors, Unity"
      ru: "The Braves (Steam, вышел) — live-service экшен в духе Vampire Survivors, Unity"
    bullets:
      en:
        - "Built an internal tool that moves content data from Google Sheets into the project’s admin panel — content integration became 10× faster."
        - "Wrote 20+ specs for artists and programmers and supported many mechanics — hero skills, weapon mechanics, boss variations — from concept through implementation and balance."
        - "Owned gamepad support and player-facing UI/UX flows, including a redesign of the achievement interface."
        - "Set up content for live updates, calculated part of an in-game event’s balance, tuned enemy difficulty, rewards and the gacha economy."
        - "Worked daily with programmers, artists and UI artists to ship ongoing live-service content."
      ru:
        - "Сделал внутренний инструмент, который переносит данные контента из Google-таблиц в админку проекта, — контент стал заводиться в 10 раз быстрее."
        - "Написал 20+ ТЗ для художников и программистов и сопровождал много механик — скиллы героев, механики оружия, вариации боссов — от идеи до реализации и баланса."
        - "Вёл поддержку геймпада и сценарии UI/UX, в том числе переделанный экран достижений."
        - "Заводил контент для live-обновлений, считал часть баланса внутриигрового ивента, настраивал сложность врагов, награды и гача-экономику."
        - "Каждый день работал с программистами, художниками и UI-художниками над регулярными live-обновлениями."
  craft-of-survival:
    project:
      en: "Craft of Survival (Google Play, released) — single-player survival RPG, Unity"
      ru: "Craft of Survival (Google Play, вышел) — одиночная survival-RPG, Unity"
    bullets:
      en:
        - "First project after moving from QA into design: set up new content for regular updates."
        - "When support for the project was paused and most of the team left, I was one of two designers who shipped a major unfinished update: fixed collisions, NavMesh and enemy spawners in Unity myself, learning the studio’s internal tools on the fly."
      ru:
        - "Первый проект после перехода из QA в дизайн: заводил новый контент для регулярных обновлений."
        - "Когда поддержку проекта приостановили и большая часть команды ушла, мы вдвоём с коллегой довыпустили крупное недоделанное обновление: сам чинил в Unity коллизии, NavMesh и спавнеры врагов, по ходу осваивая внутренние инструменты студии."
  qa:
    bullets:
      en:
        - "Part-time role while finishing university and my entry point into the industry: learned production pipelines, bug triage and debugging workflows from the inside."
      ru:
        - "Подработка, пока доучивался в университете, и вход в индустрию: изнутри разобрался в производственном пайплайне, триаже багов и отладке."

