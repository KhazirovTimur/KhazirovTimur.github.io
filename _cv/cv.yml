# Bullets per career entry. `ref` matches the project ref in _data/career.yml
# (the QA entry has ref: qa). Order follows _data/career.yml.
jobs:
  pioner:
    project:
      en: "PIONER (Steam, released December 2025) — open-world MMO shooter, Unreal Engine; team of ~70"
      ru: "PIONER (Steam, релиз в декабре 2025) — MMO-шутер с открытым миром, Unreal Engine; команда ~70 человек"
    bullets:
      en:
        - "Balance almost every game system: combat, economy, progression, loot, crafting, vendor pricing. In my first ~7 months, a colleague and I rebalanced the entire game; calculated stats for 50+ enemy types, from regular mobs to bosses. Introduced a weapon power score based on effective TTK and DPS, so weapons work in both PvP and PvE while staying distinct."
        - "Write and maintain balance tables and feature specs."
        - "Built a C++ tool that walks a level and exports every loot spawner (~3,000 on the largest map) with its loot tables and expected item counts to CSV, so loot can be balanced across the whole map in spreadsheets; now used by designers in my department and by level designers."
        - "Owned many mechanics from spec to Blueprints, including hip-fire spread with an honest crosshair and a full rework of the perk system, and integrated them without breaking existing systems."
        - "Prototype and iterate on weapons, armor, consumables and enemies for live updates, based on internal testing and player feedback."
        - "Lead two junior designers: set tasks and review design docs; redesigned the friends, chat and clan UX with one of them."
        - "Spotted a grenade readability problem (smoke and damage-zone edges) and got it fixed through a junior designer."
        - "Work closely with engineers and artists to take new weapons and systems from concept to live content."
      ru:
        - "Балансирую почти все системы игры: бой, экономику, прогрессию, лут, крафт, цены у торговцев. За первые ~7 месяцев вдвоём с коллегой пересобрали баланс всей игры; рассчитал параметры 50+ типов врагов, от обычных до боссов. Ввёл оценку мощи оружия, которая считается из эффективных TTK и DPS, чтобы оружие работало и в PvP, и в PvE и при этом различалось."
        - "Пишу и поддерживаю балансные таблицы и ТЗ."
        - "Написал на C++ инструмент, который проходит по уровню и выгружает в CSV все спавнеры лута (около 3 000 на самой большой карте) с лут-таблицами и ожидаемым количеством предметов, так что лут всей карты можно балансировать в таблицах; выгрузкой пользуются дизайнеры отдела и левел-дизайнеры."
        - "Вёл от ТЗ до реализации на Blueprints множество механик, в том числе разброс от бедра с честным прицелом и переработку системы перков, и встраивал их в игру, ничего не ломая."
        - "Прототипирую и дорабатываю оружие, броню, расходники и врагов для live-обновлений."
        - "Руковожу двумя младшими дизайнерами: ставлю задачи и проверяю их документацию; с одним из них переработал UX списка друзей, чата и кланов."
        - "Нашёл проблему с читаемостью эффектов гранат (дым и границы зон поражения) и через младшего дизайнера добился её исправления."
        - "Вместе с программистами и художниками довожу новое оружие и системы от концепта до live-контента."
  the-braves:
    project:
      en: "The Braves (Steam, released) — live-service action game in the spirit of Vampire Survivors, Unity; team of ~30, 5 game designers"
      ru: "The Braves (Steam, вышел) — live-service экшен в духе Vampire Survivors, Unity; команда ~30, 5 геймдизайнеров"
    bullets:
      en:
        - "Wrote 25+ specs for artists and programmers and owned many mechanics (hero skills, weapon behaviors, boss variations) from concept through implementation and balance."
        - "Built a UI-automation script that moves data from Google Sheets into a browser-only admin panel with no API, making content setup 10× faster."
        - "Designed gamepad controls for every screen, including a single Sony / Xbox / Nintendo layout table in the spec; the player profile (achievement showcase, frames, avatars) took two design iterations."
        - "Set up content for live updates, tuned enemy difficulty, rewards and the gacha economy; calculated gacha drop rates for seasonal events."
      ru:
        - "Написал 25+ ТЗ для художников и программистов и вёл множество механик (скиллы героев, поведение оружия, вариации боссов) от идеи до реализации и баланса."
        - "Написал скрипт UI-автоматизации, который переносит данные из Google Таблиц в браузерную админку без API; контент стал заводиться в 10 раз быстрее."
        - "Спроектировал управление с геймпада для всех экранов, включая единую таблицу раскладок Sony, Xbox и Nintendo в ТЗ; профиль игрока (витрина достижений, рамки, аватары) сделал за две итерации."
        - "Заводил контент для live-обновлений, настраивал сложность врагов, награды и гача-экономику; рассчитывал шансы выпадения в гаче для сезонных ивентов."
  craft-of-survival:
    project:
      en: "Craft of Survival (Google Play, released) — single-player survival RPG, Unity"
      ru: "Craft of Survival (Google Play, вышел) — одиночная survival-RPG, Unity"
    bullets:
      en:
        - "First project after moving from QA into design: set up new content for regular updates."
        - "When most of the team left, a colleague and I shipped a major update on schedule with no critical bugs; I owned the new location, enemies and content."
      ru:
        - "Первый проект после перехода из QA в дизайн: заводил новый контент к регулярным обновлениям."
        - "Когда большая часть команды ушла, вдвоём с коллегой выпустили крупное обновление в срок и без критических багов; на мне были новая локация, враги и контент."
  qa:
    bullets:
      en:
        - "A Random Dice-style PvP tower defense with a short update cycle; in a ~15-person team also coordinated task readiness with programmers and ran and published builds."
      ru:
        - "PvP tower defense в духе Random Dice с коротким циклом обновлений; в команде из ~15 человек также собирал статус задач у программистов, запускал и публиковал билды."

