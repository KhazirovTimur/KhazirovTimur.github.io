# Single source for both CVs (EN + RU).
# Contacts come from _data/profile.yml, job titles and dates from _data/career.yml,
# so the CVs can never disagree with the site on those.
# Build: python3 tools/build_cv.py   (writes assets/files/Timur_Khazirov_CV*.pdf)

title:
  en: "Senior Technical / Balance Game Designer"
  ru: "Senior-геймдизайнер: техдизайн и баланс"

note:
  en: "Moscow · Open to relocation or remote · Available immediately"
  ru: "Москва · Готов к релокации или удалённой работе · Выход сразу"

