profile:
  en:
    - "Technical game designer with 5+ years of professional experience on multiplayer and live-service games in Unreal Engine and Unity, and three shipped commercial titles."
    - "I own features from design through release, prototype gameplay in Blueprints and C++, balance combat, progression and economy systems, and work closely with engineering teams."
    - "My technical background lets me build prototypes and internal production tools myself and iterate on gameplay quickly."
    - "Built 50+ mechanics across shipped games and personal projects in C#, C++ and Blueprints."
    - "Lead two junior designers in a team of 10 game designers."
  ru:
    - "Технический геймдизайнер: 5+ лет в коммерческой разработке мультиплеерных и live-service игр на Unreal Engine и Unity, три вышедших проекта."
    - "Веду механики от идеи до релиза, сам прототипирую геймплей на Blueprints и C++, балансирую бой, прогрессию и экономику и плотно работаю с программистами."
    - "Благодаря технической базе сам собираю прототипы, быстро дорабатываю геймплей итерациями и делаю внутренние инструменты для команды."
    - "Реализовал 50+ механик в вышедших играх и личных проектах на C#, C++ и Blueprints."
    - "Руковожу двумя младшими дизайнерами в команде из 10 геймдизайнеров."

competencies:
  en: ["Weapon & combat mechanics", "In-engine implementation (Blueprints / C++)", "Rapid prototyping & iteration", "Systems integration", "Vehicle & locomotion prototyping", "Design & technical documentation", "Cross-department collaboration", "Tools & workflow improvement", "Mentoring & feedback", "Balance & economy", "Systemic design"]
  ru: ["Механики оружия и боя", "Реализация в движке (Blueprints / C++)", "Быстрое прототипирование и итерации", "Интеграция систем", "Прототипирование техники и передвижения", "Дизайн- и техническая документация", "Работа с разными отделами", "Улучшение инструментов и пайплайна", "Менторство и фидбек", "Баланс и экономика", "Системный дизайн"]

