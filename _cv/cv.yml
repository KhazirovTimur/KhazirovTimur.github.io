# Single source for both CVs (EN + RU).
# Contacts come from _data/profile.yml, job titles and dates from _data/career.yml,
# so the CVs can never disagree with the site on those.
# Build: python3 tools/build_cv.py   (writes assets/files/Timur_Khazirov_CV*.pdf)

title:
  en: "Senior Technical / Balance Game Designer"
  ru: "Senior-геймдизайнер: техдизайн и баланс"

note:
  en: "Moscow · Open to relocation or remote · Available immediately"
  ru: "Москва · Готов к релокации или удалёнке · Выход сразу"

headings:
  profile:     { en: "Profile", ru: "О себе" }
  competencies: { en: "Core competencies", ru: "Ключевые компетенции" }
  skills:      { en: "Technical skills", ru: "Технические навыки" }
  experience:  { en: "Professional experience", ru: "Опыт работы" }
  projects:    { en: "Personal projects", ru: "Личные проекты" }
  education:   { en: "Education & certifications", ru: "Образование и сертификаты" }
  additional:  { en: "Additional skills", ru: "Дополнительные навыки" }
  languages:   { en: "Languages", ru: "Языки" }
  portfolio:   { en: "Portfolio", ru: "Портфолио" }
  project:     { en: "Project", ru: "Проект" }

profile:
  en:
    - "Technical game designer with 5+ years of professional experience on multiplayer and live-service games in Unreal Engine and Unity, and three shipped commercial titles."
    - "I own features from design through release, prototype gameplay in Blueprints and C++, balance combat, progression and economy systems, and work closely with engineering teams."
    - "A strong technical background lets me iterate on gameplay quickly, build prototypes myself and create internal production tools."
    - "Built 50+ mechanics across shipped games and personal projects in C#, C++ and Blueprints."
    - "Lead two junior designers in a team of 10 game designers; contributed to commercial PC and mobile titles."
  ru:
    - "Технический геймдизайнер: 5+ лет в коммерческой разработке мультиплеерных и live-service игр на Unreal Engine и Unity, три вышедших проекта."
    - "Веду механики от идеи до релиза, сам прототипирую геймплей на Blueprints и C++, балансирую бой, прогрессию и экономику и плотно работаю с программистами."
    - "Технический бэкграунд позволяет быстро итерировать геймплей, собирать прототипы и делать внутренние инструменты для команды."
    - "Реализовал 50+ механик в вышедших играх и личных проектах на C#, C++ и Blueprints."
    - "Руковожу двумя младшими дизайнерами в команде из 10 геймдизайнеров; участвовал в выпуске коммерческих проектов на PC и мобильных платформах."

competencies:
  en: ["Weapon & combat mechanics", "In-engine implementation (Blueprints / C++)", "Rapid prototyping & iteration", "Systems integration", "Vehicle & locomotion prototyping", "Design & technical documentation", "Cross-department collaboration", "Tools & workflow improvement", "Mentoring & feedback", "Balance & economy", "Systemic design"]
  ru: ["Механики оружия и боя", "Реализация в движке (Blueprints / C++)", "Быстрое прототипирование и итерации", "Интеграция систем", "Прототипирование техники и передвижения", "Дизайн- и техническая документация", "Работа с разными отделами", "Улучшение инструментов и пайплайна", "Менторство и фидбек", "Баланс и экономика", "Системный дизайн"]

skills:
  - name: { en: "Design", ru: "Дизайн" }
    text:
      en: "Weapon & combat mechanics, gameplay systems integration, rapid prototyping & iteration, vehicle/locomotion prototyping, player progression, economy design, design & technical documentation"
      ru: "Механики оружия и боя, интеграция геймплейных систем, прототипирование и итерации, прототипирование техники и передвижения, прогрессия игрока, дизайн экономики, документация"
  - name: { en: "Unreal Engine", ru: "Unreal Engine" }
    text:
      en: "UE4/UE5, Blueprints, C++ gameplay programming, Gameplay Tags, Enhanced Input, Animation Blueprints, Behavior Trees, AI Controllers, State Machines, Data Tables, Primary Data Assets, NavMesh, Gameplay Debugging"
      ru: "UE4/UE5, Blueprints, геймплейное программирование на C++, Gameplay Tags, Enhanced Input, Animation Blueprints, Behavior Trees, AI Controllers, State Machines, Data Tables, Primary Data Assets, NavMesh, Gameplay Debugging"
  - name: { en: "Unity", ru: "Unity" }
    text:
      en: "C#, MonoBehaviour, ScriptableObjects, NavMesh, gameplay implementation & prototyping"
      ru: "C#, MonoBehaviour, ScriptableObjects, NavMesh, прототипирование геймплея"
  - name: { en: "Programming", ru: "Программирование" }
    text: { en: "C++, C#, Python", ru: "C++, C#, Python" }
  - name: { en: "Tools", ru: "Инструменты" }
    text:
      en: "Git, Bitbucket, Jira, Confluence, Miro, Rider, Visual Studio, Excel / Google Sheets"
      ru: "Git, Bitbucket, Jira, Confluence, Miro, Rider, Visual Studio, Excel / Google Sheets"

# Bullets per career entry. `ref` matches the project ref in _data/career.yml
# (the QA entry has ref: qa). Order follows _data/career.yml.
jobs:
  pioner:
    project:
      en: "PIONER (Steam, released December 2025) — open-world MMO shooter, Unreal Engine 5; team of ~70"
      ru: "PIONER (Steam, релиз в декабре 2025) — MMO-шутер с открытым миром, Unreal Engine 5; команда ~70 человек"
    bullets:
      en:
        - "Owned four features end-to-end, from spec to in-engine implementation in Blueprints: hip-fire spread and dynamic crosshair (spread now depends on stance, speed and sustained fire, with a crosshair that shows the actual spread), automatic reload and a full rework of the perk system — all integrated into existing systems without breaking them."
        - "Balance a set of interconnected systems: combat, economy, progression, loot, crafting, vendor pricing and boss parameters; calculated stats for dozens of enemies, from regular mobs to bosses."
        - "Spotted and drove, through a junior designer, a fix for grenade readability: smoke and damage-zone edges."
        - "Built a C++ tool that walks a level and exports every loot spawner (~3,000 on the largest map) with its loot tables and expected item counts to CSV, so loot can be balanced across the whole map in spreadsheets; now used by designers in my department and by level designers."
        - "Prototype and iterate on weapons, armor, consumables and enemies for live updates, based on internal testing and player feedback."
        - "Work hands-on inside existing Behavior Trees and C++ systems to understand how mechanics interact before changing them; fix gameplay issues via Blueprints."
        - "Write and maintain balance tables and feature specs. Lead two junior designers: set tasks and review design docs; redesigned the friends, chat and clan UX with one of them."
        - "Work closely with engineers and artists to take new weapons and systems from concept to live content."
      ru:
        - "Вёл от ТЗ до Blueprints четыре механики: разброс от бедра (от стойки, скорости и стрельбы) с честным прицелом, автоперезарядку и переработку перков — и встроил их в игру, ничего не сломав."
        - "Балансирую набор связанных систем: бой, экономику, прогрессию, лут, крафт, цены у торговцев и параметры боссов; рассчитал параметры десятков врагов, от обычных до боссов."
        - "Нашёл и через младшего дизайнера довёл до исправления проблемы читаемости эффектов гранат: дым и границы зон поражения."
        - "Написал на C++ инструмент, который проходит по уровню и выгружает в CSV все спавнеры лута (около 3 000 на самой большой карте) с лут-таблицами и ожидаемым количеством предметов — лут всей карты можно балансировать в таблицах; выгрузкой пользуются дизайнеры отдела и левел-дизайнеры."
        - "Прототипирую и дорабатываю оружие, броню, расходники и врагов для live-обновлений."
        - "Прежде чем менять механики, разбираюсь в Behavior Trees и C++-системах проекта; геймплейные баги чиню через Blueprints."
        - "Пишу и поддерживаю балансные таблицы и ТЗ. Руковожу двумя младшими дизайнерами: ставлю задачи и проверяю их документацию; с одним из них переработал UX списка друзей, чата и кланов."
        - "Вместе с программистами и художниками довожу новое оружие и системы от концепта до live-контента."
  the-braves:
    project:
      en: "The Braves (Steam, released) — live-service action game in the spirit of Vampire Survivors, Unity; team of ~30, 5 game designers"
      ru: "The Braves (Steam, вышел) — live-service экшен в духе Vampire Survivors, Unity; команда ~30, 5 геймдизайнеров"
    bullets:
      en:
        - "Built a UI-automation script that moves data from Google Sheets into a browser-only admin panel with no API — content integration became 10× faster."
        - "Wrote 20+ specs for artists and programmers and supported many mechanics — hero skills, weapon mechanics, boss variations — from concept through implementation and balance."
        - "Owned gamepad support across every screen, including a single Sony / Xbox / Nintendo layout table in the spec; designed the achievement showcase, frames and avatars over two iterations."
        - "Set up content for live updates, tuned enemy difficulty, rewards and the gacha economy; calculated gacha drop rates for seasonal events."
        - "Worked daily with programmers, artists and UI artists to ship ongoing live-service content."
      ru:
        - "Написал скрипт UI-автоматизации, который переносит данные из Google Таблиц в браузерную админку без API, — контент стал заводиться в 10 раз быстрее."
        - "Написал 20+ ТЗ для художников и программистов и вёл множество механик — скиллы героев, механики оружия, вариации боссов — от идеи до реализации и баланса."
        - "Спроектировал управление с геймпада для всех экранов, включая единую таблицу раскладок Sony, Xbox и Nintendo в ТЗ; спроектировал витрину достижений, рамки и аватары в две итерации."
        - "Заводил контент для live-обновлений, настраивал сложность врагов, награды и гача-экономику; рассчитывал шансы выпадения в гаче для сезонных ивентов."
        - "Каждый день работал с программистами и художниками над live-обновлениями."
  craft-of-survival:
    project:
      en: "Craft of Survival (Google Play, released) — single-player survival RPG, Unity"
      ru: "Craft of Survival (Google Play, вышел) — одиночная survival-RPG, Unity"
    bullets:
      en:
        - "First project after moving from QA into design: set up new content for regular updates."
        - "When support for the project was paused and most of the team left, I was one of two designers who shipped a major unfinished update with a new location: fixed collisions, NavMesh, spawners and the minimap in Unity myself, learning the studio’s internal tools on the fly."
      ru:
        - "Первый проект после перехода из QA в дизайн: заводил контент для обновлений."
        - "Когда поддержку приостановили и большая часть команды ушла, мы с коллегой вдвоём доделали и выпустили крупное обновление с новой локацией: сам чинил в Unity коллизии, NavMesh, спавнеры и миникарту, по ходу осваивая инструменты студии."
  qa:
    bullets:
      en:
        - "Part-time role while finishing university and my entry point into the industry: learned production pipelines, bug triage and debugging workflows from the inside."
      ru:
        - "Подработка, пока доучивался в университете, и вход в индустрию: изнутри разобрался в производственном пайплайне, триаже багов и отладке."

personal_projects:
  - name: { en: "UE5 Helicopter Prototype", ru: "Прототип вертолёта на UE5" }
    text:
      en: "Flight model based on real thrust, lift and drag formulas with tunable mass and drag coefficients, plus a nose turret with realistic aim limits and physical projectiles; C++ base classes, Blueprint content. (2025)"
      ru: "Модель полёта на реальных формулах тяги, подъёмной силы и сопротивления с настраиваемой массой и коэффициентами, носовая турель с реалистичными углами наведения и физическими снарядами; базовые классы на C++, контент на Blueprints. (2025)"
  - name: { en: "Bot Arena (Unity)", ru: "Bot Arena (Unity)" }
    text:
      en: "Wave shooter inspired by COD: Zombies — enemy AI with an attack-token queue, state machine and target leading; parameter-driven wave difficulty, three arenas with shops, grenade rocket jump. github.com/KhazirovTimur/BotArena (2023)"
      ru: "Арена-шутер против бесконечных волн врагов в духе COD: Zombies — ИИ врагов с очередью атакующих, машиной состояний и упреждением; сложность волн на параметрах, три арены с магазинами, рокет-джамп на гранате. github.com/KhazirovTimur/BotArena (2023)"
  - name: { en: "Tiny Dozzer (Mobile)", ru: "Tiny Dozzer (Mobile)" }
    text:
      en: "Physics arcade game about a bulldozer pushing cube structures into a moat against the clock: 15 levels in three seasons, icy low-friction levels, explosive barrels; Unity, previously released on Google Play. (2021)"
      ru: "Физическая аркада про бульдозер, который на время сталкивает постройки из кубов в ров: 15 уровней в трёх сезонах, скользкие зимние уровни, взрывные бочки; Unity, выходила в Google Play. (2021)"

