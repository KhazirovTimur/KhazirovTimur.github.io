name: CV is in sync with the site

on:
  push:
    paths:
      - "_cv/**"
      - "_data/career.yml"
      - "_data/profile.yml"
      - "tools/build_cv.py"
      - "assets/files/Timur_Khazirov_CV*.pdf"
      - "**/*.md"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 tools/build_cv.py --check
