  pillars:
    eyebrow: "Чем занимаюсь"
    title: "Где от меня больше всего пользы"
    items:
      - title: "Техдизайн и реализация"
        text: "Сам прототипирую фичи и довожу их до релиза — на Blueprints и C++ в UE5 или на C# в Unity. Читаю рабочие Blueprints, Behavior Trees и C++-код, чтобы понять, как связаны системы, прежде чем что-то менять."
