  personal:
    eyebrow: "Personal projects"
    title: "Prototypes I build on my own"
    lead: "Side projects made outside of work to explore mechanics and sharpen technical skills."
  pillars:
    eyebrow: "What I do"
    title: "Where I bring the most value"
    items:
      - title: "Technical design & implementation"
        text: "I prototype and ship features myself in UE5 Blueprints and C++ or Unity C#. I read production Blueprints, Behavior Trees and C++ code to understand how systems interact before changing them."
      - title: "Tools & pipeline"
        text: "When a task repeats, I automate it: a C++ parser that exports all 3,076 loot spawners of an open world to CSV, a tool that moves content data from Google Sheets into an admin panel ~5× faster than by hand."
      - title: "Balance & economy"
        text: "Interconnected balance of progression, loot, crafting, vendor pricing and resource flow, driven by spreadsheets, playtests and player feedback."
      - title: "Gameplay & combat mechanics"
        text: "20+ mechanics across shipped games — weapon behaviour, hip-fire spread and crosshair, reload and perk systems, hero skills, boss variations and gamepad controls."
      - title: "Team & documentation"
        text: "Feature specs and balance tables engineers, artists and QA can work from. I mentor junior designers — reviewing their docs and helping them own features."
  career:
    eyebrow: "Career"
    title: "From QA to Technical Game Designer"
  toolkit:
    eyebrow: "Toolkit"
    title: "Technical skills"
    groups:
      - name: "Unreal Engine 5"
        items: [Blueprints, "C++", Gameplay Tags, Enhanced Input, Animation Blueprints, Behavior Trees, AI Controllers, State Machines, Data Tables, Primary Data Assets, NavMesh, Gameplay Debugging]
      - name: "Unity"
        items: ["C#", MonoBehaviour, ScriptableObjects, Gameplay prototyping]
      - name: "Programming"
        items: ["C++", "C#", Python]
      - name: "Production"
        items: [Git, Bitbucket, Jira, Confluence, Miro, Rider, Visual Studio, Excel / Google Sheets]
  approach:
    eyebrow: "Approach"
    title: "How I work"
    quote: "A good mechanic isn’t just interesting — it fits the project’s goals, plays well with existing systems, is feasible to build and stays maintainable through production."
    points:
      - "Prototype early — playable beats documented."
      - "Understand how existing systems interact before changing them."
      - "Balance against measurable goals, not gut feeling."
      - "Automate repetitive work so the team can focus on the game."
  exploring:
    title: "Currently exploring"
    items: ["Gameplay Ability System", "Advanced Unreal Engine architecture", "REDkit workflows", "Gameplay tooling & automation", "AI-driven gameplay systems"]

