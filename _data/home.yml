        text: "Если задача повторяется — автоматизирую. C++-парсер, который выгружает в CSV около 3 000 спавнеров лута с карты открытого мира. Инструмент, который переносит данные из Google-таблиц в админку примерно в 5 раз быстрее, чем руками."
      - title: "Баланс и экономика"
        text: "Прогрессия, лут, крафт, цены у торговцев и поток ресурсов — всё это связано, и балансирую я это вместе: по таблицам, плейтестам и отзывам игроков."
      - title: "Геймплей и боевые механики"
        text: "20+ механик в вышедших играх: поведение оружия, разброс от бедра и прицел, перезарядка и перки, скиллы героев, вариации боссов, управление с геймпада."
      - title: "Команда и документация"
        text: "Пишу ТЗ и балансные таблицы, по которым реально работают программисты, художники и QA. Менторю младших дизайнеров: ревьюю доки, помогаю вести фичи."
