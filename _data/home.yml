      - name: "Programming"
        items: ["C++", "C#", Python]
      - name: "Production"
        items: [Git, Bitbucket, Jira, Confluence, Miro, Rider, Visual Studio, Excel / Google Sheets]
  approach:
    eyebrow: "Approach"
    title: "How I work"
    quote: "A good mechanic isn’t just interesting — it fits the project’s goals, plays well with existing systems, is feasible to build and stays maintainable through production."
    points:
      - "Prototype early — playable beats documented."
      - "Understand how existing systems interact before changing them."
      - "Balance against measurable goals, not gut feeling."
      - "Automate repetitive work so the team can focus on the game."
  exploring:
    title: "Currently exploring"
    items: ["Gameplay Ability System", "Advanced Unreal Engine architecture", "REDkit workflows", "Gameplay tooling & automation", "AI-driven gameplay systems"]

