# About page blocks: expertise, toolkit, approach and benchmark games. `en` and `ru` blocks mirror each other.
# Home page texts live in _data/ui.yml.

en:
  pillars:
    eyebrow: "What I do"
    title: "Where I bring the most value"
    items:
      - title: "Technical design & implementation"
        text: "I prototype and ship features myself in UE5 Blueprints and C++ or Unity C#. I read production Blueprints, Behavior Trees and C++ code to understand how systems interact before changing them."
      - title: "Tools & pipeline"
        text: "When a task repeats, I automate it: a C++ parser that exports ~3,000 loot spawners of an open-world map to CSV, a tool that moves content data from Google Sheets into an admin panel 10× faster than by hand."
      - title: "Balance & economy"
        text: "Interconnected balance of progression, loot, crafting, vendor pricing and resource flow, driven by spreadsheets, playtests and player feedback."
      - title: "Gameplay & combat mechanics"
        text: "50+ mechanics across shipped games and personal projects — weapon behaviour, hip-fire spread and crosshair, reload and perk systems, hero skills, boss variations and gamepad controls."
      - title: "Team & documentation"
        text: "Feature specs and balance tables engineers, artists and QA can work from. I lead junior designers: reviewing their docs and helping them own features."
  toolkit:
    eyebrow: "Toolkit"
    title: "Technical skills"
    groups:
      - name: "Unreal Engine 5"
        items: [Blueprints, "C++", Gameplay Tags, Enhanced Input, Animation Blueprints, Behavior Trees, AI Controllers, State Machines, Data Tables, Primary Data Assets, NavMesh, Gameplay Debugging]
      - name: "Unity"
        items: ["C#", MonoBehaviour, ScriptableObjects, Gameplay prototyping]
      - name: "Programming"
        items: ["C++", "C#", Python]
      - name: "Production"
        items: [Git, Bitbucket, Jira, Confluence, Miro, Rider, Visual Studio, Excel / Google Sheets]
  approach:
    eyebrow: "Approach"
    title: "How I work"
    quote: "A good mechanic isn’t just interesting — it fits the project’s goals, plays well with existing systems, is feasible to build and stays maintainable through production."
    points:
      - "Prototype early — playable beats documented."
      - "Understand how existing systems interact before changing them."
      - "Balance against measurable goals, not gut feeling."
      - "Automate repetitive work so the team can focus on the game."
  benchmarks:
    - { game: "Titanfall series", text: "Pilot movement and combat pace nobody has matched since, with a clever take on titans on top" }
    - { game: "Outer Wilds", text: "Exploration and puzzles woven into a time loop, and a world in motion: crumbling planets, a comet that thaws and freezes as it moves around the sun, and a sun going supernova" }
    - { game: "Sekiro", text: "Superb tactile, rhythm-driven combat that comes alive in one-on-one boss fights" }
    - { game: "Clair Obscur: Expedition 33", text: "Turn-based combat with action timing, story and music" }
    - { game: "Baldur’s Gate 3", text: "The best party RPG today" }
    - { game: "The Witcher 3", text: "Original quests, memorable characters and a unique fantasy world" }
    - { game: "Red Dead Redemption 2", text: "An immersive Wild West world" }
    - { game: "Kingdom Come: Deliverance II", text: "A faithfully recreated medieval Bohemia, almost an interactive museum, with enough systems to border on immersive sim" }
    - { game: "Subnautica", text: "The survival benchmark: exploring a beautiful, unsettling world, sound and music" }
    - { game: "ARC Raiders", text: "An extraction shooter with polished execution: far more accessible than its hardcore competitors, yet it keeps their tension and never slides into casual" }

ru:
  pillars:
    eyebrow: "Чем занимаюсь"
    title: "Где от меня больше всего пользы"
    items:
      - title: "Техдизайн и реализация"
        text: "Сам прототипирую механики и довожу их до релиза — на Blueprints и C++ в UE5 или на C# в Unity. Прежде чем что-то менять, разбираюсь в Blueprints, Behavior Trees и C++-коде проекта, чтобы понять, как связаны системы."
      - title: "Инструменты и пайплайн"
        text: "Если задача повторяется, я её автоматизирую. Например, написал на C++ парсер, который выгружает в CSV около 3 000 спавнеров лута с карты открытого мира, и инструмент, который переносит данные из Google-таблиц в админку в 10 раз быстрее, чем руками."
      - title: "Баланс и экономика"
        text: "Прогрессия, лут, крафт, цены у торговцев и поток ресурсов — всё это связано, поэтому я балансирую эти системы вместе, опираясь на таблицы, плейтесты и отзывы игроков."
      - title: "Геймплей и боевые механики"
        text: "50+ механик в вышедших играх и личных проектах: поведение оружия, разброс от бедра и прицел, перезарядка и перки, скиллы героев, вариации боссов, управление с геймпада."
      - title: "Команда и документация"
        text: "Пишу ТЗ и балансные таблицы, по которым реально работают программисты, художники и QA. Руковожу младшими дизайнерами: проверяю их документацию, помогаю вести задачи."
  toolkit:
    eyebrow: "Инструменты"
    title: "Технические навыки"
    groups:
      - name: "Unreal Engine 5"
        items: [Blueprints, "C++", Gameplay Tags, Enhanced Input, Animation Blueprints, Behavior Trees, AI Controllers, State Machines, Data Tables, Primary Data Assets, NavMesh, Gameplay Debugging]
      - name: "Unity"
        items: ["C#", MonoBehaviour, ScriptableObjects, Прототипирование геймплея]
      - name: "Программирование"
        items: ["C++", "C#", Python]
      - name: "Продакшн"
        items: [Git, Bitbucket, Jira, Confluence, Miro, Rider, Visual Studio, Excel / Google Sheets]
  approach:
    eyebrow: "Подход"
    title: "Как я работаю"
    quote: "Хорошая механика — это не только интересная идея. Она работает на цели проекта, сочетается с остальными системами, реализуема и не превращается в головную боль при поддержке."
    points:
      - "Прототип как можно раньше: поиграть лучше, чем прочитать."
      - "Сначала понять, как устроены существующие системы, и только потом их менять."
      - "Балансировать под понятные цели, а не на глазок."
      - "Автоматизировать рутину, чтобы команда занималась игрой."
  benchmarks:
    - { game: "Серия Titanfall", text: "Мувмент и динамика боя пилотов, которые так никто и не повторил, плюс интересно сделанные титаны" }
    - { game: "Outer Wilds", text: "Исследование и загадки, вшитые во временную петлю, и динамичный мир: разрушающиеся планеты, комета, которая тает и замерзает по мере удаления от солнца, и солнце, превращающееся в сверхновую" }
    - { game: "Sekiro", text: "Отличная тактильная ритм-боёвка, раскрывающаяся в битвах 1 на 1 с боссами" }
    - { game: "Clair Obscur: Expedition 33", text: "Тактический бой с экшен-элементами, сюжет и музыка" }
    - { game: "Baldur’s Gate 3", text: "Лучшая партийная RPG на сегодня" }
    - { game: "Ведьмак 3", text: "Нешаблонные квесты, интересные персонажи, уникальный фэнтезийный мир" }
    - { game: "Red Dead Redemption 2", text: "Иммерсивный мир Дикого Запада" }
    - { game: "Kingdom Come: Deliverance II", text: "Достоверно воссозданная средневековая Богемия, почти интерактивный музей, и столько механик, что RPG близка к immersive sim" }
    - { game: "Subnautica", text: "Эталон выживалки: исследование красивого и пугающего мира, звук и музыка" }
    - { game: "ARC Raiders", text: "Extraction-шутер с образцовым исполнением: он заметно доступнее хардкорных конкурентов, но сохраняет их напряжённость и не скатывается в казуальность" }
