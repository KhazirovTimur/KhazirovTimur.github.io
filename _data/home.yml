      - title: "Геймплейные и боевые механики"
        text: "20+ механик в выпущенных играх — поведение оружия, разброс от бедра и прицел, перезарядка и перки, скиллы героев, вариации боссов, управление с геймпада."
      - title: "Команда и документация"
        text: "ТЗ и балансные таблицы, по которым могут работать программисты, художники и QA. Менторю младших дизайнеров — ревьюю их доки и помогаю вести фичи."
