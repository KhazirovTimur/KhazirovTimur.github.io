    ru: "Первый проект после перехода из QA в дизайн: заводил контент для регулярных обновлений. Когда большая часть команды ушла, мы с коллегой вдвоём доделали и выпустили крупное обновление."

- company: 101XP
  projects: []
  role:   { en: "QA Specialist", ru: "QA-специалист" }
  period: { en: "May 2021 — Dec 2022", ru: "Май 2021 — декабрь 2022" }
  text:
    en: "A part-time role while finishing university, on a PvP tower defense game in the spirit of Random Dice, where I got used to working in a team with a short update cycle. The team was small, about 15 people, so I also took on my first project-coordination role: checking task readiness with programmers, running builds and publishing them. After graduating I moved to another project at the same studio and started my move into game design."
    ru: "Подрабатывал, пока доучивался в университете: работал на PvP tower defense в духе Random Dice и получил опыт работы в команде с коротким циклом выпуска обновлений. Команда была небольшой, около 15 человек, поэтому мне досталась и первая проектная роль: узнавал у программистов о готовности задач, запускал сборки билдов и публиковал их. После выпуска перешёл в той же студии на другой проект и начал осваивать геймдизайн."
