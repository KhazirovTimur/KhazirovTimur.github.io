- company: 101XP
  projects: [the-braves]
  role:   { en: "Technical Game Designer · The Braves", ru: "Технический геймдизайнер · The Braves" }
  period: { en: "Mar 2023 — Nov 2024", ru: "Март 2023 — ноябрь 2024" }
  text:
    en: "Set up content for updates and events, wrote specs for and owned mechanics: hero skills, weapons, gamepad controls. Designed boss variations and balanced enemies. To work more efficiently, built a tool that moved data from Google Sheets into the admin panel 10× faster than by hand."
    ru: "Заводил контент для обновлений и ивентов, писал ТЗ и вёл механики: скиллы героев, оружие, управление с геймпада. Проектировал вариации боссов и балансировал врагов. Для повышения эффективности работы написал инструмент, который переносит данные из Google Таблиц в админку в 10 раз быстрее ручного ввода."

- company: 101XP
