# Site settings
title: Timur Khazirov
url: "https://khazirovtimur.github.io"
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Plugins supported by GitHub Pages
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache

# Language: English is default, everything under /ru/ is Russian.
# `ref` links a page to its translation (same ref = same page in another language).
defaults:
  - scope:
      path: ""
    values:
      layout: page
      lang: en
  - scope:
      path: "ru"
    values:
      lang: ru
